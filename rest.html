<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Restaurant Website</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      font-family: Arial, sans-serif;
    }

    .hero{
      background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836') center/cover no-repeat;
      height: 80vh;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero h1{
      font-size: 60px;
      font-weight: bold;
    }

    .card img{
      height: 200px;
      object-fit: cover;
    }

    footer{
      background: #212529;
      color: white;
      padding: 15px;
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Food Hub</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Menu</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div>
      <h1>Welcome to Food Hub</h1>
      <p>Fresh & Delicious Food</p>

      <button class="btn btn-warning">
        Order Now
      </button>
    </div>
  </section>

  <!-- Menu Section -->
  <div class="container mt-5">

    <h2 class="text-center mb-4">Popular Dishes</h2>

    <div class="row">

      <!-- Card 1 -->
      <div class="col-md-4 mb-4">
        <div class="card shadow">

          <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591"
               class="card-img-top"
               alt="Pizza">

          <div class="card-body text-center">
            <h5 class="card-title">Pizza</h5>
            <p class="card-text">Cheesy and tasty pizza.</p>

            <button class="btn btn-dark">
              ₹199
            </button>
          </div>

        </div>
      </div>

      <!-- Card 2 -->
      <div class="col-md-4 mb-4">
        <div class="card shadow">

          <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd"
               class="card-img-top"
               alt="Burger">

          <div class="card-body text-center">
            <h5 class="card-title">Burger</h5>
            <p class="card-text">Juicy chicken burger.</p>

            <button class="btn btn-dark">
              ₹149
            </button>
          </div>

        </div>
      </div>

      <!-- Card 3 -->
      <div class="col-md-4 mb-4">
        <div class="card shadow">

          <img src="food.jpg"
               class="card-img-top"
               alt="Pasta">

          <div class="card-body text-center">
            <h5 class="card-title">Pasta</h5>
            <p class="card-text">Creamy white sauce pasta.</p>

            <button class="btn btn-dark">
              ₹179
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2026 Food Hub Restaurant</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
