<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register</title>

  <!-- Bootstrap -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body{
      background-color: #e6f0ff;
      font-family: Arial;
    }

    .register-box{
      width: 350px;
      background-color: white;
      padding: 25px;
      margin: auto;
      margin-top: 80px;
      border-radius: 10px;
    }

    h2{
      text-align: center;
      color: #0d6efd;
      margin-bottom: 20px;
    }

    .btn-custom{
      background-color: #0d6efd;
      color: white;
      width: 100%;
    }

  </style>

</head>

<body>

  <div class="register-box">

    <h2>
      Register
    </h2>

    <form>

      <div class="mb-3">

        <label>Name</label>

        <input type="text"
               class="form-control"
               placeholder="Enter Name">

      </div>

      <div class="mb-3">

        <label>Email</label>

        <input type="email"
               class="form-control"
               placeholder="Enter Email">

      </div>

      <div class="mb-3">

        <label>Password</label>

        <input type="password"
               class="form-control"
               placeholder="Enter Password">

      </div>

      <button class="btn btn-custom">
        Register
      </button>

    </form>

    <p class="text-center mt-3">

      Already Have Account ?

      <a href="login.html">
        Login
      </a>

    </p>

  </div>

</body>
</html>
