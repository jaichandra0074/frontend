<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vistara Hotel</title>

  <!-- Bootstrap CSS -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body{
      background-color: #f5f5f5;
      font-family: Arial;
    }

    .navbar{
      background-color: black;
    }

    .navbar-brand{
      color: gold !important;
      font-size: 24px;
    }

    .hero{
      height: 70vh;

      background-image: url('https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=1200');

      background-size: cover;
      background-position: center;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;
      color: white;
    }

    .hero h1{
      font-size: 50px;
    }

    .card img{
      height: 200px;
      object-fit: cover;
    }

    footer{
      background-color: black;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }

  </style>

</head>

<body>

  <!-- Navbar -->

  <nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

      <a class="navbar-brand" href="#">
        Vistara
      </a>

      <button class="navbar-toggler"
              data-bs-toggle="collapse"
              data-bs-target="#menu">

        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="menu">

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">

            <a class="nav-link active" href="index.html">
              Home
            </a>

          </li>

          <li class="nav-item">

            <a class="nav-link" href="login.html">
              Login
            </a>

          </li>

          <li class="nav-item">

            <a class="nav-link" href="register.html">
              Register
            </a>

          </li>

        </ul>

      </div>

    </div>

  </nav>

  <!-- Hero Section -->

  <section class="hero">

    <div>

      <h1>Welcome To Vistara</h1>

      <p>Best Hotel And Restaurant</p>

      <a href="register.html" class="btn btn-warning">
        Book Now
      </a>

    </div>

  </section>

  <!-- Hotel Rooms -->

  <div class="container mt-5">

    <h2 class="text-center mb-4">
      Hotel Rooms
    </h2>

    <div class="row">

      <!-- Room 1 -->

      <div class="col-md-4 mb-4">

        <div class="card">

          <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200"
               class="card-img-top">

          <div class="card-body text-center">

            <h4>Deluxe Room</h4>

            <p>₹5000 Per Night</p>

            <a href="register.html" class="btn btn-dark">
              Book
            </a>

          </div>

        </div>

      </div>

      <!-- Room 2 -->

      <div class="col-md-4 mb-4">

        <div class="card">

          <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?q=80&w=1200"
               class="card-img-top">

          <div class="card-body text-center">

            <h4>Luxury Room</h4>

            <p>₹7000 Per Night</p>

            <a href="register.html" class="btn btn-dark">
              Book
            </a>

          </div>

        </div>

      </div>

      <!-- Room 3 -->

      <div class="col-md-4 mb-4">

        <div class="card">

          <img src="https://images.unsplash.com/photo-1566665797739-1674de7a421a?q=80&w=1200"
               class="card-img-top">

          <div class="card-body text-center">

            <h4>Family Room</h4>

            <p>₹6000 Per Night</p>

            <a href="register.html" class="btn btn-dark">
              Book
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- Restaurant -->

  <div class="container mt-5">

    <h2 class="text-center mb-4">
      Restaurant
    </h2>

    <div class="row">

      <!-- Food 1 -->

      <div class="col-md-4 mb-4">

        <div class="card">

          <img src="https://images.getrecipekit.com/20250430065258-blog-20templates-20-25.webp?aspect_ratio=16:9&quality=90&"
               class="card-img-top">

          <div class="card-body text-center">

            <h4>Chicken Biryani</h4>

            <p>₹250</p>

            <button class="btn btn-dark">
              Order Now
            </button>

          </div>

        </div>

      </div>

      <!-- Food 2 -->

      <div class="col-md-4 mb-4">

        <div class="card">

          <img src="https://www.yumcurry.com/wp-content/uploads/2020/06/pizza-margherita-recipe.jpg"
               class="card-img-top">

          <div class="card-body text-center">

            <h4>Pizza</h4>

            <p>₹300</p>

            <button class="btn btn-dark">
              Order Now
            </button>

          </div>

        </div>

      </div>

      <!-- Food 3 -->

      <div class="col-md-4 mb-4">

        <div class="card">

          <img src="https://www.modernfarmhouseeats.com/wp-content/uploads/2023/04/crispy-chicken-burger-1.jpg"
               class="card-img-top">

          <div class="card-body text-center">

            <h4>Burger</h4>

            <p>₹150</p>

            <button class="btn btn-dark">
              Order Now
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- Footer -->

  <footer>

    <p>
       2026 Vistara Hotel
    </p>

  </footer>

  <!-- Bootstrap JS -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
